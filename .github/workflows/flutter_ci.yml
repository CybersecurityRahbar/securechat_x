name: Flutter CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Format Dart sources
        run: dart format lib test integration_test

      - name: Commit formatting changes
        run: |
          if git diff --quiet -- lib test integration_test; then
            echo "Dart sources are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test integration_test
          git commit -m "style: format Dart sources [skip ci]"
          git push

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Integration smoke test
        run: flutter test integration_test/app_launch_test.dart

      - name: Ensure Gradle wrapper is executable
        run: chmod +x android/gradlew

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: securechat-x-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
