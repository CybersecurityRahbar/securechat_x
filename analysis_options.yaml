include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Rules unknown to the installed `lints` version are downgraded so the
    # analyzer never fails on them.
    invalid_runtime_check_with_js_interop_types: ignore
    unnecessary_library_name: ignore
    no_wildcard_variable_uses: ignore
    type_literal_in_constant_pattern: ignore
    unintended_html_in_doc_comment: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    invalid_runtime_check_with_js_interop_types: false
    unnecessary_library_name: false
    no_wildcard_variable_uses: false
    type_literal_in_constant_pattern: false
    unintended_html_in_doc_comment: false
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    avoid_print: true
