# codemagic.yaml
workflows:
  build-android:
    name: Build Android APK
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      vars:
        SECURECHAT_WS_URL: "wss://your-server.com/ws"
        SECURECHAT_API_URL: "https://your-server.com"
        SECURECHAT_CERT_PIN: "YOUR_BASE64_PIN"
      groups:
        - android_credentials 
    scripts:
      - name: تنظيف وتهيئة المشروع بالكامل (حذف الكاش وحل التبعيات من الصفر)
        script: |
          rm -rf .dart_tool
          rm -rf build
          rm -rf pubspec.lock
          flutter clean
          flutter pub get
          
      - name: بناء APK (تطبيق قابل للتثبيت)
        script: |
          flutter build apk --release --dart-define=SECURECHAT_WS_URL=$SECURECHAT_WS_URL --dart-define=SECURECHAT_API_URL=$SECURECHAT_API_URL --dart-define=SECURECHAT_CERT_PIN=$SECURECHAT_CERT_PIN
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - your_email@example.com
