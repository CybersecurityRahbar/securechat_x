version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cryptography: ^2.7.0
  connectivity_plus: ^6.1.0
  record: 6.2.1
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  pointycastle: ^3.9.1
  crypto: ^3.0.3
  bip39: ^1.0.6
  convert: ^3.1.2
  path_provider: ^2.1.4
  permission_handler: ^11.3.1
  web_socket_channel: ^2.1.0
  http: ^1.2.2
  flutter_webrtc: ^0.12.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.3
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  image: ^4.3.0
  audioplayers: ^6.1.0
  flutter_local_notifications: ^17.2.0
  device_info_plus: ^11.1.0
